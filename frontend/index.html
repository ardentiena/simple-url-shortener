<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>URL Shortener</title>
    <script>
        try {
            const storedTheme = localStorage.getItem("preferred-theme");
            if (storedTheme === "dark" || storedTheme === "light") {
                document.documentElement.dataset.theme = storedTheme;
            }
        } catch (storageError) {
            /* penyimpanan tidak tersedia, ikuti pengaturan sistem */
        }
    </script>
    <style>
        :root {
            color-scheme: light dark;
            --paper: #ffffff;
            --ink: #000000;
            --muted: #595959;
            --red: #d71920;
            --label-column: 8rem;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --paper: #000000;
                --ink: #ffffff;
                --muted: #a3a3a3;
                --red: #ff5a5f;
            }
        }

        :root[data-theme="light"] { color-scheme: light; }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --paper: #000000;
            --ink: #ffffff;
            --muted: #a3a3a3;
            --red: #ff5a5f;
        }

        [hidden] { display: none; }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            align-items: center;
            padding: clamp(1rem, 4vh, 4rem) clamp(1rem, 5vw, 3rem);
            background: var(--paper);
            color: var(--ink);
            font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
            line-height: 1.5;
        }

        main {
            width: 100%;
            max-width: 72rem;
            margin: 0 auto;
        }

        h1 {
            max-width: 10ch;
            margin: 0 0 clamp(1rem, 3vh, 2rem);
            font-size: clamp(2.5rem, min(11vw, 12vh), 5.5rem);
            font-weight: 700;
            line-height: 0.95;
            letter-spacing: -0.04em;
            text-wrap: balance;
        }

        .intro {
            max-width: 28rem;
            margin: 0;
            font-size: 1.125rem;
        }

        .field-row + .field-row { margin-top: clamp(1rem, 3.5vh, 2rem); }

        label {
            display: block;
            margin-bottom: 0.25rem;
            font-weight: 700;
        }

        input {
            display: block;
            width: 100%;
            padding: 0.6rem 0;
            background: transparent;
            color: var(--ink);
            border: 0;
            border-bottom: 2px solid var(--ink);
            border-radius: 0;
            font: inherit;
            font-size: 1.25rem;
            outline: none;
        }

        input::placeholder { color: var(--muted); }

        input:user-invalid { border-bottom-color: var(--red); }

        input:focus-visible {
            border-bottom-color: var(--red);
            box-shadow: 0 2px 0 var(--red);
        }

        .hint {
            display: block;
            margin-top: 0.5rem;
            color: var(--muted);
            font-size: 0.875rem;
        }

        #submit-button {
            display: block;
            width: 100%;
            margin-top: clamp(1.25rem, 4vh, 2.5rem);
            padding: 1rem 1.25rem;
            background: var(--ink);
            color: var(--paper);
            border: 0;
            border-radius: 0;
            font: inherit;
            font-size: 1.125rem;
            font-weight: 700;
            text-align: left;
            cursor: pointer;
        }

        #submit-button:hover:not(:disabled) { background: var(--red); }

        #submit-button:focus-visible {
            outline: 3px solid var(--ink);
            outline-offset: 3px;
        }

        #submit-button:disabled {
            background: var(--muted);
            cursor: not-allowed;
        }

        @media (prefers-reduced-motion: no-preference) {
            #submit-button { transition: background-color 120ms ease-out; }
        }

        .topbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: clamp(0.5rem, 3vh, 2.5rem);
        }

        #theme-toggle {
            display: inline-flex;
            margin-right: -0.6rem;
            padding: 0.6rem;
            background: none;
            color: var(--ink);
            border: 0;
            cursor: pointer;
        }

        #theme-toggle:hover { color: var(--red); }

        #theme-toggle:focus-visible {
            outline: 3px solid var(--ink);
            outline-offset: 3px;
        }

        #captcha-container {
            margin-top: 2rem;
            padding: 1rem;
            border: 2px solid var(--ink);
            overflow-x: auto;
        }

        #result-message {
            margin: 2rem 0 0;
            padding: 0.25rem 0 0.25rem 1rem;
            border-left: 4px solid var(--ink);
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        #result-message:empty { display: none; }
        #result-message.info { border-left-color: var(--muted); }
        #result-message.error { border-left-color: var(--red); }

        #result-message a {
            display: block;
            margin-top: 0.25rem;
            color: var(--ink);
            font-size: 1.5rem;
            text-decoration: underline;
            text-decoration-thickness: 3px;
            text-underline-offset: 4px;
        }

        #result-message a:hover { color: var(--red); }

        #result-message a:focus-visible {
            outline: 3px solid var(--ink);
            outline-offset: 3px;
        }

        .copy-button {
            margin-top: 0.75rem;
            padding: 0.5rem 1rem;
            background: transparent;
            color: var(--ink);
            border: 2px solid var(--ink);
            border-radius: 0;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .copy-button:hover {
            background: var(--ink);
            color: var(--paper);
        }

        .copy-button:focus-visible {
            outline: 3px solid var(--ink);
            outline-offset: 3px;
        }

        @media (min-width: 48rem) {
            .row {
                display: grid;
                grid-template-columns: var(--label-column) 1fr;
                column-gap: 2rem;
            }
            .row > :first-child:last-child { grid-column: 2; }
            label { margin-bottom: 0; padding-top: 0.75rem; }
        }

        @media (min-width: 56rem) {
            main {
                display: grid;
                grid-template-columns: 5fr 7fr;
                column-gap: 4rem;
                align-items: center;
            }
            .topbar { grid-column: 1 / -1; }
            h1 { font-size: clamp(2.25rem, min(5.5vw, 14vh), 5.5rem); }
        }

        @media (max-height: 40rem) {
            .intro { display: none; }
        }
    </style>
</head>
<body>
<main>
    <div class="topbar">
        <button id="theme-toggle" type="button" aria-label="Ganti ke mode gelap" title="Ganti ke mode gelap"></button>
    </div>

    <section class="headline">
        <h1>Pendekkan link panjangmu</h1>
        <p class="intro">Pilih alias sendiri, tempel URL tujuan, lalu dapatkan link pendek yang langsung bisa dipakai.</p>
    </section>

    <section class="workspace">
        <form id="create-link-form">
            <div class="row field-row">
                <label for="long-url-input">URL tujuan</label>
                <div>
                    <input id="long-url-input" type="url" required placeholder="https://example.com/halaman-panjang">
                </div>
            </div>

            <div class="row field-row">
                <label for="alias-input">Alias link</label>
                <div>
                    <input id="alias-input" type="text" required minlength="5" maxlength="50"
                           pattern="[0-9A-Za-z_\-]{5,50}" title="Minimal 5 karakter: huruf, angka, - dan _"
                           autocomplete="off" aria-describedby="alias-hint">
                    <span class="hint" id="alias-hint">Minimal 5 karakter: huruf, angka, - dan _</span>
                </div>
            </div>

            <div class="row">
                <button id="submit-button" type="submit">Buat link pendek</button>
            </div>
        </form>

        <div class="row"><div id="captcha-container" hidden></div></div>
        <div class="row"><p id="result-message" aria-live="polite"></p></div>
    </section>
</main>

<script>
    const createLinkForm = document.getElementById("create-link-form");
    const aliasInput = document.getElementById("alias-input");
    const longUrlInput = document.getElementById("long-url-input");
    const submitButton = document.getElementById("submit-button");
    const captchaContainer = document.getElementById("captcha-container");
    const resultMessage = document.getElementById("result-message");

    const themeToggleButton = document.getElementById("theme-toggle");
    const darkSchemeQuery = window.matchMedia("(prefers-color-scheme: dark)");
    const themeStorageKey = "preferred-theme";

    function currentTheme() {
        return document.documentElement.dataset.theme || (darkSchemeQuery.matches ? "dark" : "light");
    }

    const iconAttributes = 'width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"';
    const moonIconMarkup = '<svg ' + iconAttributes + '><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
    const sunIconMarkup = '<svg ' + iconAttributes + '><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

    function updateThemeToggle() {
        const isDarkTheme = currentTheme() === "dark";
        const toggleLabel = isDarkTheme ? "Ganti ke mode terang" : "Ganti ke mode gelap";
        themeToggleButton.innerHTML = isDarkTheme ? sunIconMarkup : moonIconMarkup;
        themeToggleButton.setAttribute("aria-label", toggleLabel);
        themeToggleButton.title = toggleLabel;
    }

    themeToggleButton.addEventListener("click", () => {
        const nextTheme = currentTheme() === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = nextTheme;
        try {
            localStorage.setItem(themeStorageKey, nextTheme);
        } catch (storageError) {
            /* penyimpanan tidak tersedia, pilihan berlaku sampai halaman ditutup */
        }
        updateThemeToggle();
    });

    darkSchemeQuery.addEventListener("change", updateThemeToggle);
    updateThemeToggle();

    let turnstileScriptPromise = null;
    let turnstileWidgetId = null;
    let captchaSiteKey = null;

    async function copyShortUrl(shortUrl, copyButton) {
        let copySucceeded = false;
        try {
            await navigator.clipboard.writeText(shortUrl);
            copySucceeded = true;
        } catch (clipboardError) {
            const temporaryTextarea = document.createElement("textarea");
            temporaryTextarea.value = shortUrl;
            temporaryTextarea.setAttribute("readonly", "");
            temporaryTextarea.style.position = "fixed";
            temporaryTextarea.style.opacity = "0";
            document.body.appendChild(temporaryTextarea);
            temporaryTextarea.select();
            copySucceeded = document.execCommand("copy");
            temporaryTextarea.remove();
        }
        copyButton.textContent = copySucceeded ? "Tersalin" : "Gagal menyalin";
        setTimeout(() => { copyButton.textContent = "Salin link"; }, 2000);
    }

    function showSuccess(shortUrl) {
        const shortUrlLink = document.createElement("a");
        shortUrlLink.href = shortUrl;
        shortUrlLink.textContent = shortUrl;
        const copyButton = document.createElement("button");
        copyButton.type = "button";
        copyButton.className = "copy-button";
        copyButton.textContent = "Salin link";
        copyButton.addEventListener("click", () => copyShortUrl(shortUrl, copyButton));
        resultMessage.className = "success";
        resultMessage.replaceChildren("Link dibuat:", shortUrlLink, copyButton);
    }

    function showInfo(infoText) {
        resultMessage.className = "info";
        resultMessage.textContent = infoText;
    }

    function showError(errorText) {
        resultMessage.className = "error";
        resultMessage.textContent = errorText;
    }

    function clearMessage() {
        resultMessage.className = "";
        resultMessage.textContent = "";
    }

    function loadTurnstileScript() {
        if (!turnstileScriptPromise) {
            turnstileScriptPromise = new Promise((resolve, reject) => {
                const scriptElement = document.createElement("script");
                scriptElement.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
                scriptElement.async = true;
                scriptElement.onload = resolve;
                scriptElement.onerror = () => {
                    turnstileScriptPromise = null;
                    reject(new Error("Verifikasi tidak dapat dimuat, coba lagi."));
                };
                document.head.appendChild(scriptElement);
            });
        }
        return turnstileScriptPromise;
    }

    function clearCaptchaWidget() {
        if (turnstileWidgetId !== null) {
            window.turnstile.remove(turnstileWidgetId);
            turnstileWidgetId = null;
        }
        captchaContainer.hidden = true;
    }

    async function requestCaptchaToken(siteKey) {
        if (!siteKey) {
            throw new Error("Konfigurasi verifikasi tidak lengkap.");
        }
        await loadTurnstileScript();
        clearCaptchaWidget();
        captchaContainer.hidden = false;
        return new Promise((resolve, reject) => {
            turnstileWidgetId = window.turnstile.render(captchaContainer, {
                sitekey: siteKey,
                theme: currentTheme(),
                callback: (captchaToken) => resolve(captchaToken),
                "error-callback": () => reject(new Error("Verifikasi gagal, coba lagi.")),
                "expired-callback": () => reject(new Error("Verifikasi kedaluwarsa, kirim ulang.")),
                "timeout-callback": () => reject(new Error("Verifikasi habis waktu, kirim ulang.")),
            });
        });
    }

    async function solveCaptcha(siteKey) {
        showInfo("Selesaikan verifikasi singkat di bawah untuk melanjutkan.");
        const captchaToken = await requestCaptchaToken(siteKey);
        clearCaptchaWidget();
        return captchaToken;
    }

    function sendCreateLinkRequest(captchaToken) {
        const requestHeaders = { "Content-Type": "application/json" };
        if (captchaToken) {
            requestHeaders["X-Turnstile-Token"] = captchaToken;
        }
        return fetch("/api/links", {
            method: "POST",
            headers: requestHeaders,
            body: JSON.stringify({
                alias: aliasInput.value.trim(),
                longUrl: longUrlInput.value.trim()
            })
        });
    }

    createLinkForm.addEventListener("submit", async (submitEvent) => {
        submitEvent.preventDefault();
        submitButton.disabled = true;
        clearMessage();

        try {
            let captchaToken = captchaSiteKey ? await solveCaptcha(captchaSiteKey) : null;
            let apiResponse = await sendCreateLinkRequest(captchaToken);
            let responseBody = await apiResponse.json().catch(() => ({}));

            if (apiResponse.status === 403 && responseBody.captchaRequired && !captchaToken) {
                captchaSiteKey = responseBody.siteKey;
                captchaToken = await solveCaptcha(captchaSiteKey);
                apiResponse = await sendCreateLinkRequest(captchaToken);
                responseBody = await apiResponse.json().catch(() => ({}));
            }

            if (apiResponse.ok) {
                showSuccess(responseBody.shortUrl);
            } else {
                showError(responseBody.detail || "Gagal membuat link, status " + apiResponse.status);
            }
        } catch (requestError) {
            clearCaptchaWidget();
            showError(requestError instanceof TypeError
                ? "Server tidak dapat dihubungi."
                : requestError.message);
        } finally {
            submitButton.disabled = false;
        }
    });
</script>
</body>
</html>
