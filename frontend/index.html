<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>URL Shortener</title>
    <style>
        :root { color-scheme: light dark; }
        body { font-family: system-ui, sans-serif; max-width: 480px; margin: 4rem auto; padding: 0 1rem; }
        label { display: block; margin-top: 1rem; font-weight: 600; }
        input { width: 100%; padding: 0.5rem; margin-top: 0.25rem; box-sizing: border-box; }
        button { margin-top: 1.5rem; padding: 0.6rem 1.2rem; cursor: pointer; }
        #result-message { margin-top: 1.5rem; word-break: break-all; }
        #result-message.error { color: #c0392b; }
    </style>
</head>
<body>
<main>
    <h1>URL Shortener</h1>
    <form id="create-link-form">
        <label for="alias-input">Alias</label>
        <input id="alias-input" type="text" required minlength="5" maxlength="50" autocomplete="off">

        <label for="long-url-input">URL tujuan</label>
        <input id="long-url-input" type="url" required placeholder="https://example.com/halaman-panjang">

        <button id="submit-button" type="submit">Buat link pendek</button>
    </form>
    <p id="result-message"></p>
</main>

<script>
    const createLinkForm = document.getElementById("create-link-form");
    const aliasInput = document.getElementById("alias-input");
    const longUrlInput = document.getElementById("long-url-input");
    const submitButton = document.getElementById("submit-button");
    const resultMessage = document.getElementById("result-message");

    function showSuccess(shortUrl) {
        const shortUrlLink = document.createElement("a");
        shortUrlLink.href = shortUrl;
        shortUrlLink.textContent = shortUrl;
        resultMessage.className = "";
        resultMessage.replaceChildren("Link dibuat: ", shortUrlLink);
    }

    function showError(errorText) {
        resultMessage.className = "error";
        resultMessage.textContent = errorText;
    }

    createLinkForm.addEventListener("submit", async (submitEvent) => {
        submitEvent.preventDefault();
        submitButton.disabled = true;
        resultMessage.textContent = "";

        try {
            const apiResponse = await fetch("/api/links", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    alias: aliasInput.value.trim(),
                    longUrl: longUrlInput.value.trim()
                })
            });
            const responseBody = await apiResponse.json().catch(() => ({}));

            if (apiResponse.ok) {
                showSuccess(responseBody.shortUrl);
            } else {
                showError(responseBody.detail || "Gagal membuat link, status " + apiResponse.status);
            }
        } catch (networkError) {
            showError("Server tidak dapat dihubungi.");
        } finally {
            submitButton.disabled = false;
        }
    });
</script>
</body>
</html>
