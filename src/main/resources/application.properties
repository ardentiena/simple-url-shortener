# spring config
spring.config.import=optional:file:.env[.properties]
spring.application.name=urlshortener
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=200ms
spring.data.redis.connect-timeout=200ms

# app config
app.cache.enabled=true
app.cache.max-ttl=PT24H

# server config
server.port=8081
server.address=127.0.0.1
server.forward-headers-strategy=native

# app host config
app.host=${APP_HOST:localhost}

# APIs
safe-browsing.api-key=${SAFE_BROWSING_API_KEY:}
safe-browsing.enabled=${SAFE_BROWSING_ENABLED:true}
safe-browsing.fail-open=false
safe-browsing.timeout=2s

# turnstile verification
turnstile.enabled=${TURNSTILE_ENABLED:true}
turnstile.site-key=${TURNSTILE_SITE_KEY:}
turnstile.secret-key=${TURNSTILE_SECRET_KEY:}
turnstile.timeout=2s