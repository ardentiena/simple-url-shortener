map $http_cf_connecting_ip $client_ip_for_app {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

map $http_cf_connecting_ip $forwarded_proto_for_app {
    default https;
    ""      $scheme;
}

server {
    listen 80;
    server_name localhost;

    root /var/www/urlshortener;

    location = / {
        try_files /index.html =404;
    }

    location ~ "^/(api/.*|[0-9a-zA-Z_-]{5,50})$" {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $client_ip_for_app;
        proxy_set_header X-Forwarded-Proto $forwarded_proto_for_app;
    }

    location / {
        try_files $uri =404;
    }
}